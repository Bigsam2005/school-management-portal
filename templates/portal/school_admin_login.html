{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Admin Login | {{ school.name }}</title>
    <link rel="stylesheet" href="{% static 'portal/style.css' %}">
    <style>
        :root {
            --school-primary: {{ school.primary_color|default:"#173b73" }};
            --school-secondary: {{ school.secondary_color|default:"#ffffff" }};
        }
    </style>

</head>
<body>

<header class="portal-header">
    <div class="school-name">
        {{ school.name }}
    </div>

    {% if school %}
<a href="{% url 'school_portal' school.slug %}" class="admin-link">
{% else %}
<a href="/" class="admin-link">
{% endif %}
        Back Home
    </a>
</header>

<main class="hero">
    <section class="hero-content">

        <span class="hero-badge">
            SCHOOL ADMIN PORTAL
        </span>

        <h1>School Admin Login</h1>

        <p>
            Sign in with your school-admin phone number and password.
        </p>

        {% if error %}
            <div class="login-error">
                {{ error }}
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="login-field">
                <label for="phone">Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter phone number"
                    required
                >
            </div>

            <div class="login-field">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >
            </div>

            <button
                type="submit"
                class="portal-button login-button"
            >
                Login
            </button>

        </form>

    </section>
</main>

</body>
</html>
