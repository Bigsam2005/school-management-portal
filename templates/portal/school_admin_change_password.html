<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password | {{ school.name }}</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f6fb;
            color: #071b3d;
        }
        .wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            background: white;
            width: 100%;
            max-width: 480px;
            padding: 38px;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0,0,0,.08);
        }
        .badge {
            display: table;
            margin: 0 auto 18px;
            padding: 8px 15px;
            border-radius: 20px;
            background: #eaf1fc;
            color: #174681;
            font-weight: bold;
            font-size: 13px;
        }
        h1 {
            text-align: center;
            margin: 0 0 8px;
        }
        .school {
            text-align: center;
            color: #61708a;
            margin-bottom: 28px;
        }
        label {
            display: block;
            font-weight: bold;
            margin: 16px 0 7px;
        }
        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #c9d3e2;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: 0;
            border-radius: 8px;
            background: #1d4b87;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .message {
            padding: 11px;
            margin-bottom: 15px;
            border-radius: 8px;
            background: #fff1f1;
            color: #9d1c1c;
        }
        .note {
            margin-top: 18px;
            font-size: 13px;
            color: #68758a;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="card">
        <div class="badge">FIRST LOGIN SECURITY</div>

        <h1>Change Your Password</h1>
        <div class="school">{{ school.name }}</div>

        {% if messages %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <label>New Password</label>
            <input type="password" name="password1" minlength="8" required>

            <label>Confirm New Password</label>
            <input type="password" name="password2" minlength="8" required>

            <button type="submit">Change Password & Continue</button>
        </form>

        <div class="note">
            For security, you must replace your temporary password before accessing the school dashboard.
        </div>
    </div>
</div>
</body>
</html>
