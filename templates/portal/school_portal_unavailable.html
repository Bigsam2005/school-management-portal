<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ unavailable_title }} | {{ school.name }}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #071c3d;
        }

        .header {
            background: #214d87;
            color: white;
            padding: 26px 7%;
            font-size: 22px;
            font-weight: 700;
        }

        .page {
            min-height: calc(100vh - 82px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        .card {
            width: 100%;
            max-width: 760px;
            background: white;
            border-radius: 22px;
            padding: 55px 45px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,.06);
        }

        .badge {
            display: inline-block;
            background: #eaf1fb;
            color: #16457f;
            padding: 9px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 34px;
        }

        h2 {
            margin: 25px 0 15px;
            font-size: 25px;
        }

        p {
            margin: 0 auto;
            max-width: 580px;
            font-size: 17px;
            line-height: 1.7;
            color: #53657d;
        }

        .status {
            margin-top: 30px;
            padding: 17px;
            border-radius: 12px;
            background: #fff6e5;
            color: #7a4c00;
            font-weight: 700;
        }

        @media (max-width: 600px) {
            .card {
                padding: 38px 22px;
            }

            h1 {
                font-size: 27px;
            }

            h2 {
                font-size: 22px;
            }
        }
    </style>

</head>

<body>

<div class="header">
    {{ school.name }}
</div>

<div class="page">
    <div class="card">

        <div class="badge">SCHOOL MANAGEMENT PORTAL</div>

        <h1>{{ school.name }}</h1>

        <h2>{{ unavailable_title }}</h2>

        <p>
            {{ unavailable_message }}
        </p>

        <div class="status">
            Portal access is currently unavailable.
        </div>

    </div>
</div>

</body>
</html>
